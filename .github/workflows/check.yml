name: flake-check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [hl01, hl02, hl03, nix-ai]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate ${{ matrix.host }}
        run: |
          nix eval .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath
      - name: Upload updated flake.lock
        if: matrix.host == 'hl01'
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
